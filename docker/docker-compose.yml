services:
  publication-list:
    image: docker.ub.gu.se/gup-publication-list:${GIT_REVISION}${PLATFORM:-}
    environment:
      NUXT_GUP_URL: ${NUXT_GUP_URL:-http://localhost:8181}
      NUXT_ADMIN_BACKEND_URL: ${NUXT_ADMIN_BACKEND_URL}
      NUXT_ELASTICSEARCH_URL: ${NUXT_ELASTICSEARCH_URL}
    ports:
      - "127.0.0.1:20600:5001"
    networks:
      - gup-admin

